<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WhatsApp</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-viewport">
    <!-- Top Header -->
    <div class="top-header">
        <div class="brand-badge">
            <img id="customAppLogo" src="https://files.catbox.moe/rfq2cl.jpg" style="width:26px; height:26px; border-radius: 6px; display: none;">
            <span>DH CHAT</span>
        </div>
        <div class="header-icons">
            <i class="fa-solid fa-camera"></i>
            <i class="fa-solid fa-ellipsis-vertical" onclick="toggleMenu()"></i>
        </div>

        <!-- 3-Dots Menu -->
        <div class="menu-popup" id="menuDropdown">
            <div class="menu-item" onclick="window.location.href='/profile.html'">Settings / Profile</div>
            <div class="menu-item" onclick="triggerPwa()">Install App</div>
            <div class="menu-item" style="color: #ff3b66;" onclick="logout()">Logout</div>
        </div>
    </div>

    <!-- Search Bar -->
    <div style="padding: 8px 14px; background: var(--bg-top);">
        <div style="background: #111b21; border-radius: 20px; display: flex; align-items: center; padding: 7px 14px; gap: 10px;">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted); font-size: 14px;"></i>
            <input type="text" id="liveSearchInput" placeholder="Ask Meta AI or Search" style="background: transparent; border:none; outline:none; color:#fff; width:100%; font-size:14px;" oninput="searchLiveUsers(this.value)">
        </div>
    </div>

    <!-- Status Horizontal Bar (Updates) -->
    <div class="status-tray" id="statusTray">
        <div class="status-circle-node" onclick="window.location.href='/profile.html'">
            <div class="status-ring my-ring">
                <img id="myStatusImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
                <div class="status-plus-badge">+</div>
            </div>
            <span style="font-size: 11px; color: var(--text-muted);">My status</span>
        </div>
    </div>

    <!-- Chats Scroll List -->
    <div class="chats-scroll" id="chatsFeed">
        <div style="text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 13px;">
            Search an account by number to start real-time chat.
        </div>
    </div>

    <!-- Active Private Chat Room Deck -->
    <div id="liveChatDeck" style="position: absolute; inset:0; background: var(--bg-dark); display: none; flex-direction: column; z-index: 40;">
        <div class="top-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-arrow-left" style="cursor: pointer;" onclick="closeLiveChat()"></i>
                <img id="activeChatAvatar" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover;">
                <div>
                    <div id="activeChatName" style="font-size: 15px; font-weight: 600;">Contact</div>
                    <div id="activeChatPhone" style="font-size: 11px; color: var(--accent-green);">online</div>
                </div>
            </div>
        </div>

        <div style="flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px;" id="messageTrack"></div>

        <div style="padding: 8px 12px; background: var(--bg-top); display: flex; align-items: center; gap: 8px;">
            <input type="file" id="chatPhotoFile" accept="image/*" style="display: none;" onchange="sendPhotoMsg(event)">
            <i class="fa-solid fa-camera" style="font-size: 20px; color: var(--text-muted); cursor: pointer;" onclick="document.getElementById('chatPhotoFile').click()"></i>
            <input type="text" id="liveMsgInput" placeholder="Message" style="flex:1; background: #111b21; border:none; outline:none; border-radius: 20px; padding: 10px 16px; color:#fff; font-size:14px;" autocomplete="off">
            <button style="width: 40px; height: 40px; border-radius: 50%; background: var(--accent-green); border:none; color:white; cursor:pointer;" onclick="dispatchMsg()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-tabs">
        <a class="tab-btn active" href="/"><i class="fa-solid fa-comment-dots"></i><span>Chats</span></a>
        <a class="tab-btn" href="javascript:alert('Status is active in the top tray!')"><i class="fa-solid fa-circle-notch"></i><span>Updates</span></a>
        <a class="tab-btn" href="/profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
