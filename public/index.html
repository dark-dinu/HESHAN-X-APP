<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DH CHAT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0c1317; display: flex; justify-content: center; align-items: center; height: 100vh; color: #e9edef; }
        
        .chat-app { width: 100%; max-width: 500px; height: 100vh; display: flex; flex-direction: column; background: #111b21; box-shadow: 0 0 20px rgba(0,0,0,0.7); }
        @media (min-width: 550px) { .chat-app { height: 92vh; border-radius: 16px; overflow: hidden; border: 1px solid #222d34; } }

        /* Header */
        .chat-header { background: #202c33; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a3942; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #00a884, #005c4b); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #fff; box-shadow: 0 0 10px rgba(0,168,132,0.4); }
        .brand-info h2 { font-size: 16px; color: #e9edef; }
        .brand-info span { font-size: 12px; color: #8696a0; }

        /* Chat Body */
        .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #0b141a; }
        .system-msg { align-self: center; background: rgba(32,44,51,0.85); font-size: 11px; padding: 4px 10px; border-radius: 6px; color: #8696a0; margin: 4px 0; }
        
        .msg { max-width: 80%; padding: 7px 10px 5px 10px; border-radius: 8px; font-size: 14px; position: relative; word-break: break-word; }
        .msg.me { align-self: flex-end; background: #005c4b; color: #e9edef; border-top-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: #202c33; color: #d1d7db; border-top-left-radius: 2px; }
        .msg-sender { font-size: 11px; font-weight: bold; color: #53bdeb; margin-bottom: 2px; }
        .msg-image { max-width: 100%; border-radius: 6px; margin-top: 5px; }
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.55); float: right; margin-left: 10px; margin-top: 4px; }

        /* Typing Indicator */
        .typing-bar { font-size: 12px; color: #00a884; padding: 2px 16px; height: 18px; background: #0b141a; font-style: italic; }

        /* Footer */
        .chat-footer { background: #202c33; padding: 10px; display: flex; align-items: center; gap: 8px; }
        .action-btn { background: none; border: none; font-size: 20px; color: #8696a0; cursor: pointer; padding: 5px; }
        .action-btn:hover { color: #e9edef; }
        .input-box { flex: 1; background: #2a3942; border: none; outline: none; border-radius: 8px; padding: 11px 14px; font-size: 14px; color: #fff; }
        .send-btn { background: #00a884; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-weight: bold; }
        .send-btn:hover { background: #02906f; }
        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="chat-app">
    <div class="chat-header">
        <div class="brand">
            <div class="brand-logo">DH</div>
            <div class="brand-info">
                <h2>DH CHAT</h2>
                <span id="userStatus">0 Online</span>
            </div>
        </div>
    </div>

    <div class="chat-box" id="chatBox"></div>
    <div class="typing-bar" id="typingStatus"></div>

    <div class="chat-footer">
        <input type="file" id="fileInput" accept="image/*">
        <button class="action-btn" title="Photo" onclick="document.getElementById('fileInput').click()">📷</button>
        <button class="action-btn" onclick="addEmoji('🔥')">🔥</button>
        <button class="action-btn" onclick="addEmoji('❤️')">❤️</button>
        <input type="text" id="msgInput" class="input-box" placeholder="Message එකක් ලියන්න..." autocomplete="off">
        <button class="send-btn" id="sendBtn">➤</button>
    </div>
</div>

<audio id="notifySound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myName = prompt("ඔබගේ නම ඇතුළත් කරන්න:") || "User_" + Math.floor(Math.random()*1000);

    socket.emit('user-joined', myName);

    const chatBox = document.getElementById('chatBox');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const userStatus = document.getElementById('userStatus');
    const typingStatus = document.getElementById('typingStatus');
    const fileInput = document.getElementById('fileInput');
    const notifySound = document.getElementById('notifySound');

    socket.on('update-users', (users) => {
        userStatus.textContent = `${users.length} Online`;
    });

    socket.on('system-message', (text) => {
        const div = document.createElement('div');
        div.className = 'system-msg';
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on('load-history', (messagesList) => {
        messagesList.forEach((msg) => {
            renderMessage(msg);
        });
    });

    function sendTextMessage() {
        const text = msgInput.value.trim();
        if (text) {
            socket.emit('chat-message', { user: myName, text: text });
            msgInput.value = '';
            socket.emit('typing', false);
        }
    }

    sendBtn.addEventListener('click', sendTextMessage);
    msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendTextMessage();
    });

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                socket.emit('chat-message', { user: myName, image: event.target.result });
            };
            reader.readAsDataURL(file);
        }
    });

    function addEmoji(emoji) {
        msgInput.value += emoji;
        msgInput.focus();
    }

    let typingTimer;
    msgInput.addEventListener('input', () => {
        socket.emit('typing', true);
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => socket.emit('typing', false), 1500);
    });

    socket.on('user-typing', (data) => {
        typingStatus.innerText = data.typing ? `${data.user} typing...` : '';
    });

    socket.on('chat-message', (msg) => {
        renderMessage(msg);
        if (msg.user !== myName) {
            notifySound.play().catch(() => {});
        }
    });

    function renderMessage(msg) {
        const isMe = msg.user === myName;
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : 'other'}`;

        let content = '';
        if (!isMe) content += `<div class="msg-sender">${msg.user}</div>`;
        if (msg.text) content += `<div>${msg.text}</div>`;
        if (msg.image) content += `<img src="${msg.image}" class="msg-image" alt="Image">`;
        content += `<span class="msg-time">${msg.time}</span>`;

        div.innerHTML = content;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
