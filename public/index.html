<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>DH CHAT</title>
    
    <link rel="icon" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#202c33">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    
    <style>
        html, body {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030406;
        }

        #liveChatDeck {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: #0b141a;
            display: none;
            flex-direction: column;
            z-index: 999;
        }

        .chat-topbar {
            height: 60px;
            min-height: 60px;
            background: #202c33;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .chat-scroll-area {
            flex: 1 1 auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png') repeat;
            background-blend-mode: overlay;
        }

        .chat-bottom-tray {
            flex-shrink: 0;
            min-height: 62px;
            background: #202c33;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
            position: relative;
        }

        .input-pill {
            flex: 1;
            background: #2a3942;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
        }

        .input-pill input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 12px 4px;
            font-size: 15px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #8696a0;
            font-size: 19px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-round-btn {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: 50%;
            background: #00a884;
            border: none;
            color: white;
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,168,132,0.4);
            transition: all 0.2s;
        }
        .action-round-btn.recording {
            background: #e11d48;
            animation: pulseRecord 1s infinite;
        }
        @keyframes pulseRecord {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Message Bubbles & Ticks */
        .msg-bubble {
            max-width: 80%;
            padding: 8px 12px 6px;
            border-radius: 12px;
            font-size: 14.5px;
            position: relative;
            word-break: break-word;
            display: flex;
            flex-direction: column;
        }
        .msg-bubble.me {
            align-self: flex-end;
            background: #005c4b;
            color: #fff;
            border-top-right-radius: 2px;
        }
        .msg-bubble.other {
            align-self: flex-start;
            background: #202c33;
            color: #e9edef;
            border-top-left-radius: 2px;
        }
        .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 4px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.65);
        }
        .tick-icon { font-size: 11px; margin-left: 2px; }
        .tick-icon.blue { color: #53bdeb; }

        /* Delete Button on Long press or Hover */
        .delete-msg-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e11d48;
            color: #fff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
            border: 1px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .msg-bubble:hover .delete-msg-btn { display: flex; }

        /* Unread Red Badge in Chat List */
        .unread-badge {
            background: #e11d48;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            box-shadow: 0 2px 6px rgba(225, 29, 72, 0.5);
        }

        /* Online status indicator dot */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8696a0;
            display: inline-block;
            margin-right: 4px;
        }
        .status-dot.online {
            background: #00a884;
            box-shadow: 0 0 6px #00a884;
        }

        /* Emoji Tray */
        .emoji-panel {
            position: absolute;
            bottom: 72px;
            left: 10px;
            background: #202c33;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 10px;
            display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            z-index: 1000;
        }
        .emoji-panel.show { display: grid; }
        .emoji-item {
            font-size: 22px;
            cursor: pointer;
            text-align: center;
            padding: 4px;
            border-radius: 6px;
        }
        .emoji-item:hover { background: #2a3942; }

        audio { max-width: 220px; height: 38px; outline: none; }
    </style>
</head>
<body>

<div class="app-viewport">
    <!-- Top Header -->
    <div class="top-header">
        <div class="brand-badge">
            <img src="/logo.png" alt="Logo" style="width: 34px; height: 34px; border-radius: 8px; object-fit: cover; border: 1.5px solid #00a884; display: block;">
            <span>DH CHAT</span>
        </div>
        <div class="header-icons">
            <i class="fa-solid fa-camera"></i>
            <i class="fa-solid fa-ellipsis-vertical" onclick="toggleMenu()"></i>
        </div>

        <div class="menu-popup" id="menuDropdown">
            <div class="menu-item" onclick="window.location.href='/profile.html'">Settings / Profile</div>
            <div class="menu-item" onclick="triggerPwaPrompt()">Install App</div>
            <div class="menu-item" style="color: #ff3b66;" onclick="logout()">Logout</div>
        </div>
    </div>

    <!-- Search Bar -->
    <div style="padding: 8px 14px; background: var(--bg-top);">
        <div style="background: #111b21; border-radius: 20px; display: flex; align-items: center; padding: 7px 14px; gap: 10px;">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted); font-size: 14px;"></i>
            <input type="text" id="liveSearchInput" placeholder="Ask Meta AI or Search" style="background: transparent; border:none; outline:none; color:#fff; width:100%; font-size:14px;" oninput="searchLiveUsers(this.value)">
        </div>
    </div>

    <!-- Status Tray -->
    <div class="status-tray" id="statusTray">
        <div class="status-circle-node" onclick="window.location.href='/profile.html'">
            <div class="status-ring my-ring">
                <img id="myStatusImg" src="/logo.png">
                <div class="status-plus-badge">+</div>
            </div>
            <span style="font-size: 11px; color: var(--text-muted);">My status</span>
        </div>
    </div>

    <!-- Chats List -->
    <div class="chats-scroll" id="chatsFeed">
        <div style="text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 13px;">
            Search an account by name or phone to start real-time chat.
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-tabs">
        <a class="tab-btn active" href="/"><i class="fa-solid fa-comment-dots"></i><span>Chats</span></a>
        <a class="tab-btn" href="javascript:alert('1-Hour Disappearing Security Engine active!')"><i class="fa-solid fa-circle-notch"></i><span>Updates</span></a>
        <a class="tab-btn" href="/profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a>
    </div>
</div>

<!-- Active Private Chat Deck -->
<div id="liveChatDeck">
    <div class="chat-topbar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <i class="fa-solid fa-arrow-left" style="font-size: 18px; color: #e9edef; cursor: pointer; padding: 4px;" onclick="closeLiveChat()"></i>
            <img id="activeChatAvatar" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;" onerror="this.src='/logo.png'">
            <div>
                <div id="activeChatName" style="font-size: 15px; font-weight: 600; color: #e9edef;">Contact</div>
                <div id="activeChatOnlineStatus" style="font-size: 11px; display: flex; align-items: center; color: #8696a0;">
                    <span class="status-dot" id="chatStatusDot"></span> <span id="chatStatusText">offline</span>
                </div>
            </div>
        </div>
        <span style="font-size: 10px; background: rgba(225,29,72,0.15); border: 1px solid rgba(225,29,72,0.3); color: #fb7185; padding: 3px 8px; border-radius: 8px;">1h Wipe</span>
    </div>

    <div class="chat-scroll-area" id="messageTrack"></div>

    <!-- Emoji Tray -->
    <div class="emoji-panel" id="emojiPanel">
        <div class="emoji-item" onclick="insertEmoji('😀')">😀</div>
        <div class="emoji-item" onclick="insertEmoji('😂')">😂</div>
        <div class="emoji-item" onclick="insertEmoji('❤️')">❤️</div>
        <div class="emoji-item" onclick="insertEmoji('🔥')">🔥</div>
        <div class="emoji-item" onclick="insertEmoji('👍')">👍</div>
        <div class="emoji-item" onclick="insertEmoji('🎉')">🎉</div>
        <div class="emoji-item" onclick="insertEmoji('😍')">😍</div>
        <div class="emoji-item" onclick="insertEmoji('🥺')">🥺</div>
        <div class="emoji-item" onclick="insertEmoji('😎')">😎</div>
        <div class="emoji-item" onclick="insertEmoji('🙌')">🙌</div>
        <div class="emoji-item" onclick="insertEmoji('🌸')">🌸</div>
        <div class="emoji-item" onclick="insertEmoji('💯')">💯</div>
    </div>

    <!-- Chat Bottom Input Tray -->
    <div class="chat-bottom-tray">
        <input type="file" id="chatPhotoFile" accept="image/*" style="display: none;" onchange="sendPhotoMsg(event)">
        
        <div class="input-pill">
            <button type="button" class="icon-btn" onclick="toggleEmojiTray()">
                <i class="fa-regular fa-face-smile"></i>
            </button>
            <input type="text" id="liveMsgInput" placeholder="Message" autocomplete="off" oninput="toggleActionBtn()">
            <button type="button" class="icon-btn" onclick="document.getElementById('chatPhotoFile').click()">
                <i class="fa-solid fa-camera"></i>
            </button>
        </div>

        <button type="button" class="action-round-btn" id="actionBtn" onclick="handleActionClick()">
            <i class="fa-solid fa-microphone" id="actionIcon"></i>
        </button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const user = JSON.parse(localStorage.getItem('dh_user') || 'null');
    if (!user) window.location.replace('/login.html');

    const socket = io();
    let currentPeer = null;
    let onlinePeersList = [];
    let unreadCounts = {}; // { phone: count }

    // Audio Notification Sound (WhatsApp Tone)
    const notificationSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    // Request Web Notification permission
    if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    // Audio Recording
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    socket.emit('register-socket', user.phone);
    document.getElementById('myStatusImg').src = user.avatar || '/logo.png';

    // Track Online/Offline Status
    socket.on('online-peers', (peers) => {
        onlinePeersList = peers;
        updateChatPeerStatus();
    });

    function updateChatPeerStatus() {
        if (!currentPeer) return;
        const isOnline = onlinePeersList.includes(currentPeer.phone);
        const dot = document.getElementById('chatStatusDot');
        const text = document.getElementById('chatStatusText');
        if (isOnline) {
            dot.className = 'status-dot online';
            text.innerText = 'online';
            text.style.color = '#00a884';
        } else {
            dot.className = 'status-dot';
            text.innerText = 'offline';
            text.style.color = '#8696a0';
        }
    }

    function toggleMenu() {
        document.getElementById('menuDropdown').classList.toggle('show');
    }
    window.onclick = function(e) {
        if (!e.target.matches('.fa-ellipsis-vertical')) {
            document.getElementById('menuDropdown').classList.remove('show');
        }
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });
    function triggerPwaPrompt() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => deferredPrompt = null);
        } else {
            alert('Chrome Menu (⋮) -> "Install App"');
        }
    }

    // Live Search Users
    let searchTimeout;
    function searchLiveUsers(q) {
        clearTimeout(searchTimeout);
        const feed = document.getElementById('chatsFeed');
        if (!q.trim()) return;

        searchTimeout = setTimeout(async () => {
            const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            const list = await res.json();
            feed.innerHTML = '';

            list.filter(u => u.phone !== user.phone).forEach(peer => {
                const count = unreadCounts[peer.phone] || 0;
                const isOnline = onlinePeersList.includes(peer.phone);
                const row = document.createElement('div');
                row.className = 'chat-row';
                row.id = `chat-row-${peer.phone}`;
                row.innerHTML = `
                    <div style="position: relative;">
                        <img class="chat-row-avatar" src="${peer.avatar || '/logo.png'}">
                        <span class="status-dot ${isOnline ? 'online' : ''}" style="position: absolute; bottom: 2px; right: 2px;"></span>
                    </div>
                    <div class="chat-row-content">
                        <div class="chat-row-title">
                            <span>${peer.name}</span>
                            <span class="chat-row-time" style="color: ${isOnline ? '#00a884' : '#8696a0'}">${isOnline ? 'Online' : 'Offline'}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 3px;">
                            <div class="chat-row-sub">${peer.about || peer.phone}</div>
                            ${count > 0 ? `<div class="unread-badge" id="badge-${peer.phone}">${count}</div>` : `<div class="unread-badge" id="badge-${peer.phone}" style="display:none;"></div>`}
                        </div>
                    </div>
                `;
                row.onclick = () => openChatDeck(peer);
                feed.appendChild(row);
            });
        }, 250);
    }

    // Open Chat & Mark Seen (Blue Ticks)
    async function openChatDeck(peer) {
        currentPeer = peer;
        document.getElementById('activeChatName').innerText = peer.name;
        document.getElementById('activeChatAvatar').src = peer.avatar || '/logo.png';
        document.getElementById('liveChatDeck').style.display = 'flex';
        updateChatPeerStatus();

        // Clear Unread Badge
        unreadCounts[peer.phone] = 0;
        const b = document.getElementById(`badge-${peer.phone}`);
        if (b) b.style.display = 'none';

        const track = document.getElementById('messageTrack');
        track.innerHTML = '';

        const res = await fetch(`/api/messages?user1=${user.phone}&user2=${peer.phone}`);
        const messages = await res.json();
        messages.forEach(m => appendBubble(m));
        track.scrollTop = track.scrollHeight;

        // Tell server that messages are read (Blue Ticks)
        socket.emit('mark-as-read', { senderPhone: peer.phone, readerPhone: user.phone });
    }

    function closeLiveChat() {
        currentPeer = null;
        document.getElementById('liveChatDeck').style.display = 'none';
        document.getElementById('emojiPanel').classList.remove('show');
    }

    function toggleActionBtn() {
        const text = document.getElementById('liveMsgInput').value.trim();
        const icon = document.getElementById('actionIcon');
        icon.className = text.length > 0 ? 'fa-solid fa-paper-plane' : 'fa-solid fa-microphone';
    }

    function handleActionClick() {
        const text = document.getElementById('liveMsgInput').value.trim();
        if (text.length > 0) {
            dispatchMsg();
        } else {
            toggleVoiceRecord();
        }
    }

    function toggleEmojiTray() {
        document.getElementById('emojiPanel').classList.toggle('show');
    }

    function insertEmoji(em) {
        const input = document.getElementById('liveMsgInput');
        input.value += em;
        input.focus();
        toggleActionBtn();
    }

    // Send Message
    function dispatchMsg() {
        const input = document.getElementById('liveMsgInput');
        const text = input.value.trim();
        if (!text || !currentPeer) return;

        socket.emit('private-message', {
            from: user.phone,
            to: currentPeer.phone,
            text: text
        });
        input.value = '';
        toggleActionBtn();
        document.getElementById('emojiPanel').classList.remove('show');
    }

    document.getElementById('liveMsgInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') dispatchMsg();
    });

    function sendPhotoMsg(e) {
        const file = e.target.files[0];
        if (file && currentPeer) {
            const reader = new FileReader();
            reader.onload = () => {
                socket.emit('private-message', {
                    from: user.phone,
                    to: currentPeer.phone,
                    image: reader.result
                });
            };
            reader.readAsDataURL(file);
        }
    }

    // Voice Notes Record
    async function toggleVoiceRecord() {
        const btn = document.getElementById('actionBtn');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = () => {
                        socket.emit('private-message', {
                            from: user.phone,
                            to: currentPeer.phone,
                            audio: reader.result
                        });
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
            } catch (err) {
                alert('Microphone permission required for voice notes.');
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.classList.remove('recording');
        }
    }

    // Delete message request
    function requestDeleteMessage(msgId) {
        if (confirm("Delete this message for everyone?")) {
            socket.emit('delete-message', { messageId: msgId, to: currentPeer ? currentPeer.phone : '' });
        }
    }

    // Socket Event Handlers
    socket.on('message-sent', (msg) => {
        appendBubble(msg);
    });

    socket.on('receive-private-message', (msg) => {
        // Play notification sound
        notificationSound.play().catch(() => {});

        // Web Browser Notification if not focused
        if (Notification.permission === "granted" && document.hidden) {
            new Notification(`New message from ${msg.from}`, {
                body: msg.text || 'Photo/Audio message',
                icon: '/logo.png'
            });
        }

        if (currentPeer && msg.from === currentPeer.phone) {
            appendBubble(msg);
            socket.emit('mark-as-read', { senderPhone: msg.from, readerPhone: user.phone });
        } else {
            // Increment unread count & show red badge
            unreadCounts[msg.from] = (unreadCounts[msg.from] || 0) + 1;
            const b = document.getElementById(`badge-${msg.from}`);
            if (b) {
                b.innerText = unreadCounts[msg.from];
                b.style.display = 'flex';
            }
        }
    });

    // When opponent reads messages (Turn Double Blue Ticks)
    socket.on('messages-seen', ({ by }) => {
        if (currentPeer && currentPeer.phone === by) {
            document.querySelectorAll('.tick-icon').forEach(tick => {
                tick.className = 'fa-solid fa-check-double tick-icon blue';
            });
        }
    });

    // Delete message update
    socket.on('message-deleted', ({ messageId }) => {
        const el = document.getElementById(`msg-${messageId}`);
        if (el) el.remove();
    });

    // Helper: Render Message Bubble with Ticks & Delete option
    function appendBubble(msg) {
        const isMe = msg.from === user.phone;
        const div = document.createElement('div');
        div.className = `msg-bubble ${isMe ? 'me' : 'other'}`;
        div.id = `msg-${msg._id}`;

        let body = '';
        // Delete button for sent messages
        if (isMe) {
            body += `<div class="delete-msg-btn" onclick="requestDeleteMessage('${msg._id}')" title="Delete Message"><i class="fa-solid fa-trash"></i></div>`;
        }

        if (msg.text) body += `<div>${msg.text}</div>`;
        if (msg.image) body += `<img src="${msg.image}" style="max-width:100%; border-radius:8px; margin-top:4px;">`;
        if (msg.audio) body += `<audio controls src="${msg.audio}" style="margin-top:4px;"></audio>`;

        // WhatsApp Style Ticks
        let ticks = '';
        if (isMe) {
            if (msg.status === 'read') {
                ticks = `<i class="fa-solid fa-check-double tick-icon blue"></i>`;
            } else if (msg.status === 'delivered') {
                ticks = `<i class="fa-solid fa-check-double tick-icon"></i>`;
            } else {
                ticks = `<i class="fa-solid fa-check tick-icon"></i>`;
            }
        }

        body += `
            <div class="msg-footer">
                <span>${msg.time}</span>
                ${ticks}
            </div>
        `;

        div.innerHTML = body;
        const track = document.getElementById('messageTrack');
        track.appendChild(div);
        track.scrollTop = track.scrollHeight;
    }

    function logout() {
        localStorage.removeItem('dh_user');
        window.location.replace('/login.html');
    }
</script>
</body>
</html>
