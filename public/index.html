<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DH CHAT</title>
    
    <!-- PWA Settings (Android & iOS) -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DH Chat">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3670/3670157.png">
    <meta name="theme-color" content="#0b141a">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-body: #08090c;
            --bg-card: #0b141a;
            --header-bg: #101920;
            --tab-active: #00a884;
            --accent-red: #e6143c;
            --bubble-me: #005c4b;
            --bubble-other: #1f2c34;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --border-subtle: #1c272e;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chat-app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 500px) {
            .chat-app {
                height: 94vh;
                border-radius: 20px;
                border: 1px solid var(--border-subtle);
                box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            }
        }

        /* Top Header */
        .app-header {
            background: var(--header-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .header-title span { color: var(--accent-red); }
        .header-icons {
            display: flex;
            gap: 16px;
            font-size: 18px;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* WhatsApp Search Header */
        .search-container {
            padding: 8px 12px;
            background: var(--header-bg);
            position: relative;
        }
        .search-pill {
            background: #192229;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 8px 14px;
            gap: 10px;
            border: 1px solid var(--border-subtle);
        }
        .search-pill input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
            width: 100%;
        }

        /* Stories Row (Inspired by WhatsApp Updates tab) */
        .stories-row {
            padding: 12px 14px;
            display: flex;
            gap: 14px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-subtle);
            background: #0d151c;
            scrollbar-width: none;
        }
        .stories-row::-webkit-scrollbar { display: none; }
        .story-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            min-width: 58px;
        }
        .story-ring {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid var(--tab-active);
            padding: 2px;
            position: relative;
        }
        .story-ring.me { border-color: var(--accent-red); }
        .story-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .story-name {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 58px;
        }

        /* View Panels */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .hidden { display: none !important; }

        /* Search Results List */
        .users-list {
            display: flex;
            flex-direction: column;
        }
        .user-list-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: background 0.15s;
        }
        .user-list-item:hover { background: #131c24; }
        .user-list-item img {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Active Chat Workspace */
        .chat-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png') repeat;
            background-blend-mode: overlay;
        }
        .chat-topbar {
            background: var(--header-bg);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }
        .chat-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }
        .chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bubble {
            max-width: 75%;
            padding: 7px 10px 5px;
            border-radius: 8px;
            font-size: 14px;
            position: relative;
            word-break: break-word;
            animation: bubbleAnim 0.25s ease-out;
        }
        @keyframes bubbleAnim {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bubble.me {
            align-self: flex-end;
            background: var(--bubble-me);
            color: #e9edef;
            border-top-right-radius: 2px;
        }
        .bubble.other {
            align-self: flex-start;
            background: var(--bubble-other);
            color: #d1d7db;
            border-top-left-radius: 2px;
        }
        .bubble img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 4px;
        }
        .bubble-meta {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.55);
            float: right;
            margin-left: 8px;
            margin-top: 4px;
        }

        /* Input Controls */
        .chat-input-bar {
            padding: 8px 10px;
            background: var(--header-bg);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .msg-input-box {
            flex: 1;
            background: #202c33;
            border: none;
            outline: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 14px;
        }
        .action-circle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-red);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(230, 20, 60, 0.3);
        }

        /* Profile / Settings Tab */
        .profile-container {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dp-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
        }
        .dp-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-red);
        }
        .dp-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: var(--accent-red);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-size: 16px;
        }

        /* Bottom Tab Navigation (Exact WhatsApp copy) */
        .bottom-nav {
            height: 60px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item.active {
            color: var(--tab-active);
            font-weight: 600;
        }
        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="chat-app">
    <!-- Top Bar -->
    <div class="app-header">
        <div class="header-title">DH <span>CHAT</span></div>
        <div class="header-icons">
            <span onclick="triggerInstall()" title="Install App">📲</span>
            <span onclick="switchTab('profileTab')" title="Settings">⚙️</span>
        </div>
    </div>

    <!-- TAB 1: CHATS (Home) -->
    <div class="tab-content" id="chatsTab">
        <!-- Search -->
        <div class="search-container">
            <div class="search-pill">
                <span>🔍</span>
                <input type="text" id="userSearchInput" placeholder="Search by name or phone..." oninput="handleSearch(this.value)">
            </div>
        </div>

        <!-- WhatsApp-style Status Row -->
        <div class="stories-row">
            <div class="story-node" onclick="switchTab('profileTab')">
                <div class="story-ring me">
                    <img id="myStoryAvatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
                </div>
                <div class="story-name">My Status</div>
            </div>
            <div class="story-node" onclick="alert('Ephemeral status feature coming soon!')">
                <div class="story-ring">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135768.png">
                </div>
                <div class="story-name">Updates</div>
            </div>
        </div>

        <!-- Search Results / Active Conversation list -->
        <div class="users-list" id="usersFeed">
            <div style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px;">
                Type a friend's phone number or name above to start messaging.
            </div>
        </div>
    </div>

    <!-- TAB 2: ACTIVE PRIVATE CHAT -->
    <div class="tab-content hidden" id="chatRoomTab">
        <div class="chat-view">
            <div class="chat-topbar">
                <button class="back-btn" onclick="exitChat()">←</button>
                <img id="activePartnerImg" class="chat-avatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
                <div style="flex: 1;">
                    <h4 id="activePartnerName" style="font-size: 14px; font-weight: 600;">Contact</h4>
                    <span id="activePartnerPhone" style="font-size: 11px; color: var(--text-muted);">Online</span>
                </div>
                <span style="font-size: 10px; color: #ff476e; background: #260a12; padding: 3px 8px; border-radius: 12px; border: 1px solid #ff004455;">10m Auto-Delete</span>
            </div>

            <div class="chat-feed" id="chatFeed"></div>

            <div class="chat-input-bar">
                <input type="file" id="chatImageInput" accept="image/*" style="display: none;" onchange="sendChatImage(event)">
                <button style="background:none; border:none; font-size: 20px; color: var(--text-muted); cursor: pointer;" onclick="document.getElementById('chatImageInput').click()">📷</button>
                <input type="text" id="chatTextInput" class="msg-input-box" placeholder="Message..." autocomplete="off">
                <button class="action-circle-btn" onclick="sendTextMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- TAB 3: PROFILE & SETTINGS -->
    <div class="tab-content hidden" id="profileTab">
        <div class="profile-container">
            <div class="dp-wrapper">
                <img id="profileDpImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
                <input type="file" id="dpPicker" accept="image/*" style="display: none;" onchange="handleDpUpload(event)">
                <div class="dp-badge" onclick="document.getElementById('dpPicker').click()" title="Choose Photo">📷</div>
            </div>
            
            <h3 id="profileNameDisplay" style="margin-bottom: 4px;">User</h3>
            <p id="profilePhoneDisplay" style="color: var(--accent-red); font-size: 13px; margin-bottom: 24px;">Phone</p>

            <div style="width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px;">
                <button class="action-circle-btn" style="width: 100%; border-radius: 10px; height: 42px; background: #192229; border: 1px solid var(--border-subtle);" onclick="triggerInstall()">📲 Install App on Phone</button>
                <button class="action-circle-btn" style="width: 100%; border-radius: 10px; height: 42px; background: #260a12; border: 1px solid #ff004466;" onclick="logout()">Log Out</button>
            </div>
        </div>
    </div>

    <!-- WhatsApp Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item active" id="navChats" onclick="switchTab('chatsTab')">
            <div class="nav-icon">💬</div>
            <div>Chats</div>
        </div>
        <div class="nav-item" id="navUpdates" onclick="alert('Disappearing updates are enabled by default!')">
            <div class="nav-icon">⭕</div>
            <div>Updates</div>
        </div>
        <div class="nav-item" id="navProfile" onclick="switchTab('profileTab')">
            <div class="nav-icon">👤</div>
            <div>Profile</div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const user = JSON.parse(localStorage.getItem('dh_user') || 'null');
    if (!user) {
        window.location.replace('/login.html');
    }

    const socket = io();
    let currentPartner = null;
    let deferredPrompt;

    // Service Worker for Android/iOS PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });

    function triggerInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
        } else {
            alert('To install:\n- On Android: Chrome Menu (⋮) -> Install App\n- On iOS: Safari Share -> Add to Home Screen');
        }
    }

    // App Init
    function init() {
        document.getElementById('myStoryAvatar').src = user.avatar;
        document.getElementById('profileDpImg').src = user.avatar;
        document.getElementById('profileNameDisplay').innerText = user.name;
        document.getElementById('profilePhoneDisplay').innerText = user.phone;

        socket.emit('register-socket', user.phone);
    }
    init();

    // Tab Navigation
    function switchTab(tabId) {
        document.getElementById('chatsTab').classList.add('hidden');
        document.getElementById('chatRoomTab').classList.add('hidden');
        document.getElementById('profileTab').classList.add('hidden');

        document.getElementById('navChats').classList.remove('active');
        document.getElementById('navProfile').classList.remove('active');

        document.getElementById(tabId).classList.remove('hidden');

        if (tabId === 'chatsTab') document.getElementById('navChats').classList.add('active');
        if (tabId === 'profileTab') document.getElementById('navProfile').classList.add('active');
    }

    function exitChat() {
        currentPartner = null;
        switchTab('chatsTab');
    }

    // User Search
    let searchDebounce;
    async function handleSearch(q) {
        clearTimeout(searchDebounce);
        const container = document.getElementById('usersFeed');
        if (!q.trim()) {
            container.innerHTML = `<div style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px;">Type a friend's phone number or name above to start messaging.</div>`;
            return;
        }

        searchDebounce = setTimeout(async () => {
            const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            const users = await res.json();
            container.innerHTML = '';

            const list = users.filter(u => u.phone !== user.phone);
            if (list.length === 0) {
                container.innerHTML = `<div style="padding: 20px; text-align:center; color: var(--text-muted); font-size: 13px;">No user found</div>`;
                return;
            }

            list.forEach(item => {
                const row = document.createElement('div');
                row.className = 'user-list-item';
                row.innerHTML = `
                    <img src="${item.avatar}">
                    <div style="flex: 1;">
                        <div style="font-weight: 600; font-size: 14px;">${item.name}</div>
                        <div style="font-size: 12px; color: var(--accent-red);">${item.phone}</div>
                    </div>
                `;
                row.onclick = () => openChat(item);
                container.appendChild(row);
            });
        }, 300);
    }

    // Open Chat & Load Messages
    async function openChat(partner) {
        currentPartner = partner;
        document.getElementById('activePartnerName').innerText = partner.name;
        document.getElementById('activePartnerPhone').innerText = partner.phone;
        document.getElementById('activePartnerImg').src = partner.avatar;

        switchTab('chatRoomTab');

        const feed = document.getElementById('chatFeed');
        feed.innerHTML = '';

        const res = await fetch(`/api/messages?user1=${user.phone}&user2=${partner.phone}`);
        const messages = await res.json();
        messages.forEach(m => renderBubble(m));
        feed.scrollTop = feed.scrollHeight;
    }

    // Send Text Message
    function sendTextMessage() {
        const input = document.getElementById('chatTextInput');
        const text = input.value.trim();
        if (!text || !currentPartner) return;

        socket.emit('private-message', {
            from: user.phone,
            to: currentPartner.phone,
            text: text
        });
        input.value = '';
    }

    document.getElementById('chatTextInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendTextMessage();
    });

    // Send Chat Image
    function sendChatImage(e) {
        const file = e.target.files[0];
        if (file && currentPartner) {
            const reader = new FileReader();
            reader.onload = () => {
                socket.emit('private-message', {
                    from: user.phone,
                    to: currentPartner.phone,
                    image: reader.result
                });
            };
            reader.readAsDataURL(file);
        }
    }

    // Real-Time Socket Listeners
    socket.on('message-sent', (msg) => {
        renderBubble(msg);
    });

    socket.on('receive-private-message', (msg) => {
        if (currentPartner && msg.from === currentPartner.phone) {
            renderBubble(msg);
        } else {
            alert(`New message from ${msg.from}`);
        }
    });

    function renderBubble(msg) {
        const isMe = msg.from === user.phone;
        const div = document.createElement('div');
        div.className = `bubble ${isMe ? 'me' : 'other'}`;
        
        let body = '';
        if (msg.text) body += `<div>${msg.text}</div>`;
        if (msg.image) body += `<img src="${msg.image}">`;
        body += `<span class="bubble-meta">${msg.time}</span>`;

        div.innerHTML = body;
        const feed = document.getElementById('chatFeed');
        feed.appendChild(div);
        feed.scrollTop = feed.scrollHeight;
    }

    // DP Image Picker & File Upload
    function handleDpUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async () => {
            const base64Image = reader.result;
            try {
                const res = await fetch('/api/profile/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone: user.phone,
                        name: user.name,
                        avatar: base64Image
                    })
                });
                const data = await res.json();
                if (data.success) {
                    user.avatar = base64Image;
                    localStorage.setItem('dh_user', JSON.stringify(user));
                    init();
                    alert('Profile photo updated successfully!');
                }
            } catch (err) {
                alert('Failed to upload image');
            }
        };
        reader.readAsDataURL(file);
    }

    function logout() {
        localStorage.removeItem('dh_user');
        window.location.replace('/login.html');
    }
</script>
</body>
</html>
