<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DH CHAT • Enterprise Identity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #030406;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* Subtle Dark Grid + Mesh Gradient */
        .ambient-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(220, 20, 60, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(18, 140, 126, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(10, 12, 16, 1) 0%, #030406 100%);
            z-index: 1;
        }

        .auth-container {
            width: 100%;
            max-width: 410px;
            background: rgba(14, 17, 23, 0.75);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(220, 38, 38, 0.35);
            border-radius: 28px;
            padding: 40px 32px;
            position: relative;
            z-index: 2;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(220, 20, 60, 0.06);
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-meta {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-crest {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #1c0509, #0a0a0f);
            border: 1px solid rgba(220, 38, 38, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #ff3355;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.25);
        }

        .brand-meta h1 {
            color: #f1f5f9;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand-meta p {
            color: #64748b;
            font-size: 13px;
            margin-top: 6px;
            letter-spacing: 0.1px;
        }

        .form-field {
            margin-bottom: 18px;
            position: relative;
        }

        .field-label {
            display: block;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #475569;
            font-size: 15px;
            transition: color 0.2s;
        }

        .input-control {
            width: 100%;
            background: rgba(8, 10, 15, 0.7);
            border: 1px solid #1e2638;
            border-radius: 14px;
            padding: 14px 16px 14px 44px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-control:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
            background: rgba(12, 15, 22, 0.9);
        }

        .input-control:focus + i {
            color: #dc2626;
        }

        .btn-official {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.2px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-official:active {
            transform: scale(0.98);
        }

        .switch-prompt {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #64748b;
            cursor: pointer;
        }

        .switch-prompt span {
            color: #ef4444;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="ambient-mesh"></div>

    <div class="auth-container">
        <div class="brand-meta">
            <div class="brand-crest"><i class="fa-solid fa-shield-halved"></i></div>
            <h1 id="titleHeader">Secure Terminal</h1>
            <p id="descHeader">Direct peer-to-peer encrypted communications</p>
        </div>

        <form id="authForm" onsubmit="event.preventDefault(); handleAuth();">
            <div class="form-field" id="nameBox" style="display: none;">
                <label class="field-label">Official Name</label>
                <div class="input-wrapper">
                    <input type="text" id="nameField" class="input-control" placeholder="Heshan Samaranyaka">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <div class="form-field">
                <label class="field-label">Mobile Number</label>
                <div class="input-wrapper">
                    <input type="tel" id="phoneField" class="input-control" placeholder="07xxxxxxxx" required>
                    <i class="fa-solid fa-phone"></i>
                </div>
            </div>

            <div class="form-field">
                <label class="field-label">Secret Passcode</label>
                <div class="input-wrapper">
                    <input type="password" id="passField" class="input-control" placeholder="••••••••••••" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn-official" id="actionBtn">Authorize</button>
        </form>

        <div class="switch-prompt" onclick="toggleMode()">
            <span id="toggleLink">New device? Enroll identity</span>
        </div>
    </div>

    <script>
        let isEnroll = false;

        if (localStorage.getItem('dh_user')) {
            window.location.replace('/');
        }

        function toggleMode() {
            isEnroll = !isEnroll;
            document.getElementById('nameBox').style.display = isEnroll ? 'block' : 'none';
            document.getElementById('titleHeader').innerText = isEnroll ? 'Enroll Identity' : 'Secure Terminal';
            document.getElementById('descHeader').innerText = isEnroll ? 'Generate temporary communication credentials' : 'Direct peer-to-peer encrypted communications';
            document.getElementById('actionBtn').innerText = isEnroll ? 'Enroll Now' : 'Authorize';
            document.getElementById('toggleLink').innerText = isEnroll ? 'Already enrolled? Authorize' : 'New device? Enroll identity';
        }

        async function handleAuth() {
            const phone = document.getElementById('phoneField').value.trim();
            const password = document.getElementById('passField').value;
            const name = document.getElementById('nameField').value.trim();

            const endpoint = isEnroll ? '/api/register' : '/api/login';
            const payload = isEnroll ? { name, phone, password } : { phone, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) return alert(data.error || 'Authorization refused');

                localStorage.setItem('dh_user', JSON.stringify(data.user));
                window.location.replace('/');
            } catch (err) {
                alert('Terminal connection failed.');
            }
        }
    </script>
</body>
</html>
