<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DH CHAT • Access</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#08090c">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: #08090c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Animated Neon Glows */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(230, 20, 60, 0.28), transparent 70%);
            border-radius: 50%;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }
        .glow-bottom {
            bottom: -50px;
            right: -50px;
            background: radial-gradient(circle, rgba(0, 168, 132, 0.2), transparent 70%);
            animation-delay: -4s;
        }

        @keyframes floatGlow {
            0% { transform: translate(-30px, -20px) scale(0.9); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        /* Floating Card */
        .glass-card {
            width: 100%;
            max-width: 400px;
            background: rgba(18, 20, 26, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 40, 75, 0.4);
            border-radius: 24px;
            padding: 34px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 20, 60, 0.15);
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 2;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 26px;
        }
        .logo-circle {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, #e6143c, #1a0208);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 8px 25px rgba(230, 20, 60, 0.45);
        }
        .brand-header h1 {
            color: #f0f3f6;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .brand-header p {
            color: #7d8b99;
            font-size: 13px;
            margin-top: 4px;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            color: #9aa8b6;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-field {
            width: 100%;
            padding: 13px 16px;
            background: rgba(10, 11, 15, 0.8);
            border: 1px solid #232732;
            border-radius: 12px;
            color: #e9edef;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }
        .input-field:focus {
            border-color: #e6143c;
            box-shadow: 0 0 12px rgba(230, 20, 60, 0.3);
            background: rgba(14, 16, 22, 0.95);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e6143c, #b30f2f);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(230, 20, 60, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        .btn-submit:active {
            transform: scale(0.98);
        }

        .switch-mode {
            text-align: center;
            margin-top: 20px;
            color: #7d8b99;
            font-size: 13px;
            cursor: pointer;
        }
        .switch-mode span {
            color: #ff3b66;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="ambient-glow glow-bottom"></div>

    <div class="glass-card">
        <div class="brand-header">
            <div class="logo-circle">DH</div>
            <h1 id="title">Sign In</h1>
            <p id="subTitle">Welcome back to encrypted chats</p>
        </div>

        <form id="authForm" onsubmit="event.preventDefault(); submitAuth();">
            <div class="form-group" id="nameContainer" style="display: none;">
                <label>Display Name</label>
                <input type="text" id="nameInput" class="input-field" placeholder="Heshan Samaranyaka">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phoneInput" class="input-field" placeholder="07xxxxxxxx" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passInput" class="input-field" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
        </form>

        <div class="switch-mode" onclick="toggleAuth()">
            <span id="toggleText">Need an account? Register</span>
        </div>
    </div>

    <script>
        let isLogin = true;

        if (localStorage.getItem('dh_user')) {
            window.location.replace('/');
        }

        function toggleAuth() {
            isLogin = !isLogin;
            document.getElementById('nameContainer').style.display = isLogin ? 'none' : 'block';
            document.getElementById('title').innerText = isLogin ? 'Sign In' : 'Create Account';
            document.getElementById('subTitle').innerText = isLogin ? 'Welcome back to encrypted chats' : 'Start private disappearing conversations';
            document.getElementById('submitBtn').innerText = isLogin ? 'Sign In' : 'Register';
            document.getElementById('toggleText').innerText = isLogin ? "Need an account? Register" : "Already have an account? Sign In";
        }

        async function submitAuth() {
            const phone = document.getElementById('phoneInput').value.trim();
            const password = document.getElementById('passInput').value;
            const name = document.getElementById('nameInput').value.trim();

            const url = isLogin ? '/api/login' : '/api/register';
            const body = isLogin ? { phone, password } : { name, phone, password };

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || 'Authentication failed');
                    return;
                }
                localStorage.setItem('dh_user', JSON.stringify(data.user));
                window.location.replace('/');
            } catch (err) {
                alert('Connection error');
            }
        }
    </script>
</body>
</html>
