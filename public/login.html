<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DH CHAT • Sign In</title>
    <link rel="icon" href="https://files.catbox.moe/rfq2cl.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #030406;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        .ambient-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(220, 20, 60, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(0, 168, 132, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(10, 12, 16, 1) 0%, #030406 100%);
            z-index: 1;
        }

        .auth-container {
            width: 100%;
            max-width: 410px;
            background: rgba(14, 17, 23, 0.8);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(0, 168, 132, 0.5);
            border-radius: 28px;
            padding: 40px 32px;
            position: relative;
            z-index: 2;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85);
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-meta {
            text-align: center;
            margin-bottom: 28px;
        }

        /* DH CHAT Custom Logo */
        .logo-wrap {
            width: 76px;
            height: 76px;
            border-radius: 22px;
            margin: 0 auto 16px;
            border: 2px solid #00a884;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 168, 132, 0.35);
            background: #111b21;
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .brand-meta h1 {
            color: #f1f5f9;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand-meta p {
            color: #8696a0;
            font-size: 13px;
            margin-top: 5px;
        }

        .form-field {
            margin-bottom: 16px;
        }

        .field-label {
            display: block;
            color: #8696a0;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-control {
            width: 100%;
            background: rgba(8, 10, 15, 0.7);
            border: 1px solid #1e2638;
            border-radius: 12px;
            padding: 13px 16px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: all 0.25s;
        }

        .input-control:focus {
            border-color: #00a884;
            box-shadow: 0 0 10px rgba(0, 168, 132, 0.3);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00a884, #005c4b);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 168, 132, 0.3);
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .switch-prompt {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #8696a0;
            cursor: pointer;
        }

        .switch-prompt span {
            color: #00a884;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="ambient-mesh"></div>
    <div class="auth-container">
        <div class="brand-meta">
            <div class="logo-wrap">
                <img src="https://files.catbox.moe/rfq2cl.jpg" alt="DH CHAT Logo">
            </div>
            <h1 id="titleHeader">Sign In</h1>
            <p id="descHeader">Direct peer-to-peer encrypted communications</p>
        </div>

        <form id="authForm" onsubmit="event.preventDefault(); handleAuth();">
            <div class="form-field" id="nameBox" style="display: none;">
                <label class="field-label">Official Name</label>
                <input type="text" id="nameField" class="input-control" placeholder="Heshan Samaranyaka">
            </div>

            <div class="form-field">
                <label class="field-label">Phone Number</label>
                <input type="tel" id="phoneField" class="input-control" placeholder="07xxxxxxxx" required>
            </div>

            <div class="form-field">
                <label class="field-label">Passcode</label>
                <input type="password" id="passField" class="input-control" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-action" id="actionBtn">Sign In</button>
        </form>

        <div class="switch-prompt" onclick="toggleMode()">
            <span id="toggleLink">Need an account? Register</span>
        </div>
    </div>

    <script>
        let isEnroll = false;
        if (localStorage.getItem('dh_user')) window.location.replace('/');

        function toggleMode() {
            isEnroll = !isEnroll;
            document.getElementById('nameBox').style.display = isEnroll ? 'block' : 'none';
            document.getElementById('titleHeader').innerText = isEnroll ? 'Create Account' : 'Sign In';
            document.getElementById('actionBtn').innerText = isEnroll ? 'Register' : 'Sign In';
            document.getElementById('toggleLink').innerText = isEnroll ? 'Already have an account? Sign In' : 'Need an account? Register';
        }

        async function handleAuth() {
            const phone = document.getElementById('phoneField').value.trim();
            const password = document.getElementById('passField').value;
            const name = document.getElementById('nameField').value.trim();

            const endpoint = isEnroll ? '/api/register' : '/api/login';
            const payload = isEnroll ? { name, phone, password } : { phone, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) return alert(data.error || 'Authentication failed');

                localStorage.setItem('dh_user', JSON.stringify(data.user));
                window.location.replace('/');
            } catch (err) {
                alert('Connection error');
            }
        }
    </script>
</body>
</html>
